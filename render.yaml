services:
  - type: web
    name: ravjot-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: ravjot-portfolio-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BACKEND_CORS_ORIGINS
        value: https://ravjotsingh-ml.github.io,http://localhost:5173

databases:
  - name: ravjot-portfolio-db
    databaseName: portfolio
    user: postgres
    plan: free
